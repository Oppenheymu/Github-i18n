name: CI

on:
  push:
    branches:
      - main
  pull_request:

# 最小权限：CI 只需要读仓库内容（不写 PR、不写 issue）
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 安装 Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: 安装依赖
        run: bun install --frozen-lockfile
      - name: 全量门禁（lint + typecheck + check:dict + check:manifest + check:view + test）
        run: bun run check
      - name: 构建扩展产物（dist/，构建链断裂即红灯）
        run: bun run build
