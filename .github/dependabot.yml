# Dependabot 依赖更新配置
#
# 本仓库是 Bun + TypeScript 的浏览器扩展，受管依赖只有两块：
# - github-actions：workflow 里 pin 到 commit SHA 的 action（PR 里只改 SHA 与注释，
#   合并前需人工确认版本注释同步更新）；
# - bun：devDependencies（Biome / TypeScript / 类型声明）。
#
# 生态名必须是 `bun` 而不是 `npm`：bun.lock 不是 npm 更新器能识别的锁文件，写 npm 时
# PR 只会改 package.json，而 ci.yml 跑 `bun install --frozen-lockfile`，PR 必然红灯；
# `bun` 生态认文本 bun.lock（需 Bun ≥ 1.1.39，本仓 1.4.2），会把 lockfile 一起更新。
# 该生态只做版本更新、不支持 security updates——扩展产物零运行时依赖，无实际影响。
#
# 两个生态都每周检查一次、按生态分组以减少 PR 噪声，并限制同时打开的 PR 数量。

version: 2

updates:
  # GitHub Actions：只更新 workflow 引用的 action
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "范围:构建与工具链"
    groups:
      # 所有 action 的常规更新合成一个 PR，便于一次性按 SHA 重新 pin
      github-actions:
        patterns:
          - "*"

  # bun：package.json 里的开发依赖（扩展产物零运行时依赖）
  #
  # 不写 versioning-strategy：`bun` 生态不支持该选项；package.json 的 private: true
  # 已让 Dependabot 按「应用」处理，默认策略就是 increase（抬高下界）。
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "范围:构建与工具链"
    groups:
      # 次版本与补丁版本合并；主版本单独开 PR，强制人工评估。
      # `bun` 生态不支持 groups.dependency-type，而本仓依赖全是 devDependencies，
      # 故改用 patterns 全匹配，语义与「仅开发依赖」等价。
      dev-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
